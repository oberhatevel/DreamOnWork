name: Déployer sur jamhit.fr (OVH)
on:
  push:
    branches: [main, claude/music-band-offline-app-bgc8ui]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Numéro de version (pour que les navigateurs chargent la mise à jour)
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" app/index.html app/sw.js
      - name: Envoyer les fichiers sur l'hébergement
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::Secrets FTP_SERVER, FTP_USERNAME ou FTP_PASSWORD absents : rien n'a été envoyé."
            exit 0
          fi
          # Nettoyage des valeurs saisies : espaces, préfixe ftp:// ou sftp://, barre finale.
          HOST=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##')
          USER_=$(printf '%s' "$FTP_USERNAME" | tr -d '[:space:]')
          sudo apt-get install -y -qq lftp >/dev/null
          # Copie de l'application seule (sans le dépôt git ni les fichiers de projet).
          mkdir dist
          rsync -a --exclude .git --exclude .github --exclude .gitignore --exclude dist --exclude README.md --exclude CNAME --exclude docs ./ dist/
          # Accès à la base de données pour la synchronisation (fichier créé ici, jamais enregistré dans le dépôt).
          if [ -n "$DB_HOST" ] && [ -n "$DB_NAME" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASSWORD" ]; then
            python3 - <<'PY'
          import os
          q = lambda v: "'" + v.strip().replace('\\', '\\\\').replace("'", "\\'") + "'"
          e = os.environ
          dsn = 'mysql:host=%s;dbname=%s;charset=utf8mb4' % (e['DB_HOST'].strip(), e['DB_NAME'].strip())
          open('dist/api/config.php', 'w').write("<?php return ['dsn' => %s, 'user' => %s, 'password' => %s];\n" % (q(dsn), q(e['DB_USER']), q(e['DB_PASSWORD'])))
          PY
            echo "Synchronisation : accès à la base de données configuré."
          else
            echo "::warning::Secrets DB_HOST, DB_NAME, DB_USER ou DB_PASSWORD absents : la synchronisation en ligne reste désactivée."
          fi

          for port in 22 21; do
            if timeout 15 bash -c "exec 3<>/dev/tcp/$HOST/$port" 2>/dev/null; then echo "Port $port : joignable"; else echo "Port $port : injoignable"; fi
          done

          # Envoi dans www/ (racine du site). Aucun fichier distant n'est supprimé.
          COMMON="set net:max-retries 2; set net:timeout 15; set net:reconnect-interval-base 5; set cmd:fail-exit yes; debug 3;"
          # Anciens fichiers de l'application à la racine (elle est maintenant dans app/) : retirés pour ne laisser aucune copie périmée.
          OLD="rm -f www/app.js www/sync.js www/seed-songs.js www/style.css www/sw.js www/manifest.webmanifest www/accueil.html www/icon.svg www/icon-192.png www/icon-512.png; rm -rf www/posters; rm -f www/app/seed-songs.js www/app/posters/les-smaart-2026-10-24.jpg www/app/posters/le-muutch-2026-10-09.jpg;"
          MIRROR="mirror --reverse --only-newer --no-perms --verbose dist www; set cmd:fail-exit no; $OLD bye"
          echo "::group::Essai SFTP (port 22)"
          if timeout 150 lftp -e "$COMMON set sftp:auto-confirm yes; open --env-password -u $USER_ sftp://$HOST; $MIRROR" < /dev/null; then
            echo "::endgroup::"; echo "Envoi réussi par SFTP."; exit 0
          fi
          echo "::endgroup::"
          echo "::warning::SFTP impossible, essai en FTP chiffré (FTPS)."
          echo "::group::Essai FTPS (port 21)"
          if timeout 150 lftp -e "$COMMON set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ftp:passive-mode yes; open --env-password -u $USER_ ftp://$HOST; $MIRROR" < /dev/null; then
            echo "::endgroup::"; echo "Envoi réussi par FTPS."; exit 0
          fi
          echo "::endgroup::"
          echo "::error::Envoi impossible en SFTP comme en FTPS : vérifier le serveur, l'identifiant et le mot de passe (onglet FTP-SSH d'OVH)."
          exit 1
      - name: Vérifier le site en ligne
        run: |
          check() { code=$(curl -s -o /tmp/out -w '%{http_code}' -m 20 "$2" || true); echo "$1 : HTTP $code — $(head -c 160 /tmp/out | tr '\n' ' ')"; }
          check "Présentation (attendu 200)" "https://jamhit.fr/"
          check "Application (attendu 200)" "https://jamhit.fr/app/"
          check "API sans identifiants (attendu 400 bad_band : PHP et base joignables)" "https://jamhit.fr/api/index.php?a=ping"
          check "Fichier de configuration (attendu : réponse vide)" "https://jamhit.fr/api/config.php"
          check "Dossier des fichiers joints (attendu 403)" "https://jamhit.fr/api/files/.htaccess"
