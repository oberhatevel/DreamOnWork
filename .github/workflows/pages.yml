name: Déployer sur GitHub Pages
on:
  push:
    branches: [main, claude/music-band-offline-app-bgc8ui]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Numéro de version (pour que les navigateurs chargent la mise à jour)
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" index.html sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
