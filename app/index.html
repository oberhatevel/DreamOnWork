<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JamHit</title>
<meta name="description" content="Organisation des répétitions et concerts du groupe">
<meta name="theme-color" content="#1b1530">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" href="icon.svg?v=__V__" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=__V__">
<link rel="stylesheet" href="style.css?v=__V__">
<link rel="stylesheet" href="stageplot/stageplot.css?v=__V__">
</head>
<body>
<header class="top">
  <a class="brand" href="#/sets"><img id="brand-logo" src="jamhit-logo.svg" alt=""><span id="brand-name"></span></a>
  <a id="sync-ind" href="#/data" hidden></a>
  <label class="me">Je suis <select id="me-select"></select></label>
</header>
<nav class="tabs" id="tabs">
  <a href="#/sets" data-tab="set">Sets</a>
  <a href="#/songs" data-tab="song">Morceaux</a>
  <a href="#/musicians" data-tab="musicians">Musiciens</a>
  <a href="#/band" data-tab="band">Groupe</a>
  <a href="#/tools" data-tab="tools">Outils</a>
  <a href="#/data" data-tab="data">Données</a>
</nav>
<div id="demo-banner" hidden><span>Vous voyez un <b>groupe de démonstration</b> (fictif).</span> <span class="actions"><button class="btn small primary" data-act="join">Se connecter à mon groupe</button><button class="btn small" data-act="demo-start">Créer mon groupe</button></span></div>
<main id="view"></main>
<div id="offline" hidden>Hors ligne — les données sont enregistrées sur cet appareil</div>

<dialog id="dlg">
  <form id="dlg-form">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" data-act="dlg-cancel">Annuler</button>
      <button type="submit" class="btn primary" id="dlg-ok">Enregistrer</button>
    </div>
  </form>
</dialog>

<section id="print-area"></section>
<input type="file" id="import-file" accept=".json,.csv,application/json,text/csv" hidden>
<script src="demo-data.js?v=__V__"></script>
<script src="sync.js?v=__V__"></script>
<script src="stageplot/stageplot.js?v=__V__"></script>
<script src="tools.js?v=__V__"></script>
<script src="live.js?v=__V__"></script>
<script src="app.js?v=__V__"></script>
</body>
</html>
